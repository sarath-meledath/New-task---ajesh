
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Compatibility</title>
</head>
<body>

    <h1>Multi-Format Audio Player</h1>

    <p>Listen to the song using different audio formats.</p>

    <audio controls>
        <source src="images&audio/song.mp3" type="audio/mpeg">
        <source src="images&audio/song.ogg" type="audio/ogg">
        Your browser does not support audio.
    </audio>

    <!-- Multiple formats improve browser compatibility. -->

</body>
</html>
