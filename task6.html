<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Format Audio Compatibility</title>
</head>
<body>
    
<!-- Providing multiple audio formats helps different browsers play the audio because browser support for formats may vary. -->

<audio controls>
    <source src="images&audio/song.mp3" type="audio/mpeg">
    <source src="images&audio/song.ogg" type="audio/ogg">
    Your browser does not support the audio element.
</audio>

</body>
</html>
