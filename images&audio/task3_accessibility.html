<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Accessibility and Broken Links Test</title></head>
<body>
<h1>Anime Image Gallery</h1>
<h2>Image 1</h2><img src="nature.jpg" alt="Anime-style landscape with a blue mountain lake and forest" width="300">
<h2>Image 2 - Intentionally Broken</h2><img src="missing_photo.jpg" alt="Anime-style girl standing among pink flowers" width="300">
<h2>Image 3</h2><img src="flower.jpg" alt="Anime-style portrait of a girl surrounded by cherry blossoms" width="300">
<h2>Observation</h2><p>When an image fails to load, the browser may show a broken-image icon instead of the picture. The descriptive alt text helps users understand the image content, including people using screen readers.</p>
</body></html>
