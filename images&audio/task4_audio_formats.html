<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Multi-Format Audio Compatibility</title></head>
<body><h1>Audio Compatibility Test</h1>
<!-- Multiple formats help cross-browser compatibility because browsers may support different audio codecs. -->
<audio controls><source src="song.mp3" type="audio/mpeg"><source src="song.ogg" type="audio/ogg">Your browser does not support the audio element.</audio>
</body></html>
